main{padding:16px;max-width:1100px;width:100%}

.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.k{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--br);border-radius:8px;padding:10px 12px}
.k span{display:block;color:var(--mut);font-size:13px}.k b{font-size:21px;font-variant-numeric:tabular-nums}
.k.low{border-left-color:var(--low)}.k.out{border-left-color:var(--out)}.k.over{border-left-color:var(--over)}.k.ok{border-left-color:var(--ok)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:600;background:var(--tint)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.rw{cursor:pointer}.rw:hover{background:var(--tint)}
.b{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.b.ok{color:var(--ok)}.b.low{color:var(--low)}.b.out{color:var(--out)}.b.over{color:var(--over)}
.det{background:var(--tint);white-space:normal}
.sz{display:inline-flex;align-items:center;gap:4px;margin:4px 12px 4px 0}
.sz .sn{width:60px;font-weight:600}summary{cursor:pointer;font-weight:600}details form{margin-top:10px}
.sz input{width:58px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.bar input{flex:1;min-width:200px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--br);outline-offset:1px}
nav button:focus-visible{outline-color:var(--bi)}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.pri{background:var(--br);color:var(--bi);border-color:var(--br);font-weight:600;padding:10px 16px}
button.dng{color:var(--out)}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}
label.w2{grid-column:span 2}
.tot{font-weight:600;color:var(--ink);align-self:center}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
textarea{width:100%;min-height:90px;font:12px/1.3 ui-monospace,Menlo,monospace}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
@media(min-width:900px){body{display:grid;grid-template-columns:210px 1fr}nav{flex-direction:column;align-items:stretch;overflow:visible;padding:16px 10px;position:static}nav .brand{margin:0 0 14px 6px}nav button{text-align:left}main{padding:24px 32px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}

let fq="";
const findList=()=>{const w=words(fq);if(!w.length)return `<p class="mut">Start typing to see stock for every size.</p>`;const r=DATA.filter(d=>match(d,w));
return r.slice(0,20).map(d=>{const s=stat(d[0]);return `<div class="card"><h3>${d[0]} ${esc(d[1])} ${esc(d[2])} <span class="b ${s}">${SL[s]}</span></h3><div>${d[5].map((z,i)=>`<span class="sz"><b>${esc(z)}</b>: ${S.q[d[0]][i]}</span>`).join("")}</div><p class="mut">Total ${tot(d[0])} units, ${esc(d[4])}</p></div>`}).join("")+(r.length>20?`<p class="mut">Showing 20 of ${r.length}. Type more to narrow it down.</p>`:"")||`<p class="mut">No items match.</p>`};
const V={
dash(){const s=S.sales,rev=sum(s,"total"),vat=sum(s,"tax"),pr=sum(s,"profit"),ex=rev-vat,cnt={ok:0,low:0,out:0,over:0};
DATA.forEach(d=>cnt[stat(d[0])]++);
const inR=(a,b)=>fmt(s.filter(x=>x.date>=a&&x.date<=b).reduce((t,x)=>t+x.total,0));
const top=grp(s,x=>x.code).map(([c,r])=>[c,sum(r,"qty")]).sort((a,b)=>b[1]-a[1]).slice(0,5);
const low=DATA.filter(d=>stat(d[0])=="low").sort((a,b)=>tot(a[0])-tot(b[0])).slice(0,8);
return `<h1>${esc(S.set.name)}</h1><p class="mut">Mwihoko, Kiambu County, Kenya. All amounts in KES.</p>
<div class="kp">${kp("Revenue incl. VAT",fmt(rev))}${kp("Units sold",sum(s,"qty"))}${kp("Gross profit",fmt(pr))}${kp("Gross margin",pct(ex?pr/ex:0))}${kp("VAT collected",fmt(vat))}${kp("Sales today",inR(iso(0),iso(0)))}${kp("Last 7 days",inR(iso(-6),iso(0)))}${kp("This month",inR(iso(0).slice(0,7)+"-01",iso(0)))}</div>
<h2>Stock health</h2><div class="kp">${kp("Active items",DATA.length)}${kp("Units in stock",DATA.reduce((t,d)=>t+tot(d[0]),0))}${kp("Healthy",cnt.ok,"ok")}${kp("Low stock",cnt.low,"low")}${kp("Out of stock",cnt.out,"out")}${kp("Overstock",cnt.over,"over")}</div>
<div class="two"><div><h2>Top 5 best sellers</h2>${tb(["Code","Item","Units sold"],top.map(([c,n])=>[c,esc(IDX[c][1]+" "+IDX[c][2]),n]))}</div>
<div><h2>Running low</h2>${tb(["Code","Item","Units left"],low.map(d=>[d[0],esc(d[1]+" "+d[2]),tot(d[0])]))}<p><button data-go="stock" data-low="1">See all low stock</button></p></div></div>`},
stock(){return `<h1>Stock</h1><div class="bar"><input id="q" type="search" placeholder="Search by code, product or school / colour" value="${esc(q)}" aria-label="Search stock"><select id="fl" aria-label="Filter by status"><option value="">All statuses</option>${Object.entries(SL).map(([k,l])=>`<option value="${k}"${flt==k?" selected":""}>${l}</option>`).join("")}</select></div>${itemForm()}<div id="res">${stockList()}</div>`},
sales(){return `<h1>Sales</h1><form id="sf" class="card grid"><label>Date<input type="date" name="date" value="${iso(0)}" required></label>
<label class="w2">Item<input name="item" list="dl" placeholder="Type a code or name, e.g. SWK01" required autocomplete="off"></label>
<datalist id="dl">${DATA.map(d=>`<option value="${d[0]}">${esc(d[1]+" "+d[2])}</option>`).join("")}</datalist>
<label>Size<select name="size"><option value="">Pick an item first</option></select></label>
<label>Quantity<input type="number" name="qty" min="1" value="1" required></label>
<label>Unit price (KES)<input type="number" name="price" min="0" step="any" required></label>
<label>Discount (KES)<input type="number" name="disc" min="0" step="any" value="0"></label>
<label>Profit (KES)<input type="number" name="profit" step="any" placeholder="Optional"></label>
<label>Paid by<select name="pay"><option>Cash</option><option>Paybill</option></select></label>
<div class="tot" id="pv">VAT KES 0, total KES 0</div><button class="pri">Record sale</button></form>
<h2>Sales log</h2>${salesTable()}`},
take(){return `<h1>Stock take</h1><p class="mut">Search an item, type what you counted for each size, then apply. Differences show as you type.</p><div class="bar"><input id="tq" type="search" placeholder="Search by code, product or school / colour" value="${esc(tq)}" aria-label="Search items to count"><button class="pri" data-apply="1">Apply counts</button></div><div id="tres">${takeList()}</div>`},
rep(){const s=S.sales,row=([k,r])=>{const rev=sum(r,"total"),vat=sum(r,"tax"),pr=sum(r,"profit"),ex=rev-vat;return [esc(k),sum(r,"qty"),fmt(rev),fmt(ex),fmt(vat),fmt(pr),pct(ex?pr/ex:0)]};
const H=["","Units","Revenue incl. VAT","Revenue excl. VAT","VAT","Profit","Margin"];
const inv=CATS.map(c=>{const r=DATA.filter(d=>d[4]==c),u=r.reduce((t,d)=>t+tot(d[0]),0),n=k=>r.filter(d=>stat(d[0])==k).length;return [c,u,n("ok"),n("low"),n("out"),n("over")]});
return `<h1>Reports</h1><h2>Sales by category</h2>${tb(["Category"].concat(H.slice(1)),grp(s,x=>x.cat).map(row))}
<h2>Sales by school</h2>${tb(["School"].concat(H.slice(1)),grp(s,x=>x.sch).map(row))}
<h2>VAT by month</h2>${tb(["Month","Revenue excl. VAT","VAT collected"],grp(s,x=>x.date.slice(0,7)).sort().map(([k,r])=>[k,fmt(sum(r,"total")-sum(r,"tax")),fmt(sum(r,"tax"))]))}
<h2>Sales by payment method</h2>${tb(["Method","Sales","Total"],grp(s,x=>x.pay).map(([k,r])=>[k,r.length,fmt(sum(r,"total"))]))}
<h2>Inventory by category</h2>${tb(["Category","Units","Healthy","Low","Out","Overstock"],inv)}`},
svc(){const o=S.svc;return `<h1>Services</h1><p class="mut">Logo and branding work. These orders never change stock.</p><form id="vf" class="card grid"><label>Date<input type="date" name="date" value="${iso(0)}" required></label>
<label>School<select name="school">${SCH.map(x=>`<option>${x}</option>`).join("")}</select></label>
<label>Service<select name="svc">${SVC.map(x=>`<option>${x}</option>`).join("")}</select></label>
<label>Quantity<input type="number" name="qty" min="1" value="1" required></label>
<label>Rate (KES)<input type="number" name="rate" min="0" step="any" required></label>
<label class="w2">Notes<input name="notes"></label><button class="pri">Save order</button></form>
<h2>Service orders</h2>${tb(["Order","Date","School","Service","Qty","Rate","Total","Notes",""],o.map(x=>[x.no,x.date,esc(x.school),esc(x.svc),x.qty,fmt(x.rate),fmt(x.qty*x.rate),esc(x.notes),`<button data-del="${x.id}" class="dng">Delete</button>`]))}`},
find(){return `<h1>Search</h1><div class="bar"><input id="fq" type="search" placeholder="Type a code, product or school / colour" value="${esc(fq)}" aria-label="Search items"></div><div id="fres">${findList()}</div>`},
addstock(){return `<h1>Add stock</h1><p class="mut">Use this when new stock arrives. The quantity you type is added to what is already there.</p><form id="rf" class="card grid"><label class="w2">Item<input name="item" list="dl" placeholder="Type a code or name, e.g. SWK01" required autocomplete="off"></label><datalist id="dl">${DATA.map(d=>`<option value="${d[0]}">${esc(d[1]+" "+d[2])}</option>`).join("")}</datalist><label>Size<select name="size"><option value="">Pick an item first</option></select></label><label>Quantity to add<input type="number" name="qty" min="1" value="1" required></label><button class="pri">Add stock</button></form>${itemForm(1)}`},
users(){loadUsers();return `<h1>Users</h1><p class="mut">Approve people who sign up. Pending accounts see nothing until you approve them.</p><div id="ul">Loading…</div>`},
set(){const t=S.set;return `<h1>Settings</h1><form id="stf" class="card grid"><label class="w2">Business name<input name="name" value="${esc(t.name)}"></label><label>VAT rate (%)<input type="number" name="vat" step="any" min="0" value="${t.vat*100}"></label>
<label>Low stock at or below<input type="number" name="low" min="0" value="${t.low}"></label><label>Overstock at or above<input type="number" name="high" min="1" value="${t.high}"></label><button class="pri">Save settings</button></form>
<p class="mut">Everything is saved in the shared cloud database and updates live for everyone who is signed in.</p>`}
};

let ME={role:"staff"},sb=null,ip=null;const seen=new Set();
const setSzL=(c,z,q)=>{S.sz=S.sz||{};S.sz[c]=z;S.q[c]=q;build()};
function apply(o){const p=o.payload,k=o.kind,d=IDX[p.code]||null,i=d&&p.size!=null?d[5].indexOf(p.size):-1;
if(k=="sale"){if(i<0)return;const have=S.q[p.code][i],ded=Math.min(have,p.qty),tx=p.qty*p.price*S.set.vat;S.q[p.code][i]=have-ded;S.sales.unshift({id:o.id,date:p.date,code:p.code,size:p.size,qty:p.qty,price:p.price,tax:tx,total:p.qty*p.price+tx-p.disc,disc:p.disc,profit:p.profit,pay:p.pay,cat:d[4],sch:d[3]=="school"?d[2]:"",ded,by:o.who})}
else if(k=="undo"){const s=S.sales.find(x=>x.id==p.id);if(!s)return;const e=IDX[s.code],j=e?e[5].indexOf(s.size):-1;if(j>=0)S.q[s.code][j]+=s.ded;S.sales=S.sales.filter(x=>x.id!=p.id)}
else if(k=="adj"){if(i>=0)S.q[p.code][i]=Math.max(0,S.q[p.code][i]+p.delta)}
else if(k=="item"){const it=p.item;if(IDX[it[0]])return;S.items.push(it);S.q[it[0]]=it[5].map(()=>p.open);build()}
else if(k=="addsz"){if(d&&i<0)setSzL(p.code,d[5].concat(p.size),S.q[p.code].concat(0))}
else if(k=="rmsz"){if(i>=0)setSzL(p.code,d[5].filter((_,j)=>j!=i),S.q[p.code].filter((_,j)=>j!=i))}
else if(k=="rensz"){if(d&&d[5].indexOf(p.old)>=0&&!d[5].includes(p.size)){const a=d[5].slice();a[d[5].indexOf(p.old)]=p.size;S.sales.forEach(x=>{if(x.code==p.code&&x.size==p.old)x.size=p.size});setSzL(p.code,a,S.q[p.code])}}
else if(k=="svc"){const n=Math.max(0,...S.svc.map(x=>+x.no.slice(3)))+1;S.svc.unshift(Object.assign({},p,{id:o.id,no:"SO-"+String(n).padStart(3,"0")}))}
else if(k=="svcdel")S.svc=S.svc.filter(x=>x.id!=p.id);
else if(k=="set")S.set=p}
async function send(kind,payload){if(!sb)return false;const{data,error}=await sb.from("ops").insert({kind,payload,who:ME.name||ME.email}).select().single();if(error){toast("Not saved: "+error.message);return false}seen.add(data.id);apply(data);return true}
function nav(){const ok=ME.role=="owner"?TABS:TABS.filter(t=>["find","stock","addstock","sales","take","svc"].includes(t[0]));$("#nav").innerHTML=`<span class="brand">${esc(S.set.name)}</span>`+ok.map(([k,l])=>`<button data-go="${k}" class="${k==view?"on":""}">${l}</button>`).join("")+(ip?`<button data-inst="1">Install app</button>`:"")+`<button data-out="1">Sign out</button>`}
function render(){if(ME.role!="owner"&&!["find","stock","addstock","sales","take","svc"].includes(view))view="find";nav();$("#app").innerHTML=V[view]()}
function refresh(){const a=document.activeElement;if(a&&a.closest&&a.closest("#app")&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;render()}
const box=(h,m)=>{$("#nav").innerHTML="";$("#app").innerHTML=`<div class="card" style="max-width:400px;margin:10vh auto"><h1>${h}</h1>${m}</div>`};
const authForm=m=>box(esc(S.set.name),`<p class="mut">${m||"Sign in to continue."}</p><form id="lf" class="grid" style="grid-template-columns:1fr"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="pw" minlength="6" required autocomplete="current-password"></label><button class="pri" value="in">Sign in</button><button value="up" formnovalidate>Create account</button></form>`);
async function loadUsers(){const{data,error}=await sb.from("profiles").select("*").order("created_at");const el=$("#ul");if(!el)return;if(error)return el.textContent=error.message;
el.innerHTML=tb(["Name","Email","Role","Status",""],data.map(u=>[esc(u.name),esc(u.email),u.role,u.status,u.role=="owner"?"":(u.status!="active"?`<button class="pri" data-st="${u.id}:active">Approve</button>`:"")+(u.status=="suspended"?"":` <button class="dng" data-st="${u.id}:suspended">Suspend</button>`)]))}
async function boot(){const c=window.WAPURI||{};if(!c.url||!c.key||!window.supabase)return box("Not connected yet",`<p class="mut">Add your Supabase URL and key in config.js, then reload.</p>`);
sb=sb||supabase.createClient(c.url,c.key);const{data:ss}=await sb.auth.getSession();if(!ss.session)return authForm();
const u=ss.session.user,{data:p}=await sb.from("profiles").select("*").eq("id",u.id).single();ME=p||{role:"staff",status:"pending",email:u.email};
if(ME.status!="active")return box(ME.status=="suspended"?"Access removed":"Waiting for approval",`<p class="mut">The owner needs to approve your account before you can use the system. Ask them, then reload this page.</p><button data-out="1">Sign out</button>`);
S=fresh();build();seen.clear();let all=[],from=0;for(;;){const{data,error}=await sb.from("ops").select("*").order("id").range(from,from+999);if(error)return box("Could not load data",`<p class="mut">${esc(error.message)}</p>`);all=all.concat(data);if(data.length<1000)break;from+=1000}
all.forEach(o=>{seen.add(o.id);apply(o)});view=ME.role=="owner"?"dash":"find";
sb.channel("ops").on("postgres_changes",{event:"INSERT",schema:"public",table:"ops"},m=>{const o=m.new;if(seen.has(o.id))return;seen.add(o.id);apply(o);refresh()}).subscribe();render()}
async function addSale(v){const d=IDX[v.item.trim().toUpperCase()];if(!d)return toast("Choose a product code from the list");const c=d[0],si=parseInt(v.size,10),qy=+v.qty;if(!(si>=0))return toast("Choose a size");
const have=S.q[c][si];if(qy>have&&!confirm("Only "+have+" in stock for size "+d[5][si]+". Record the sale anyway?"))return;
if(await send("sale",{date:v.date,code:c,size:d[5][si],qty:qy,price:+v.price,disc:+v.disc||0,profit:+v.profit||0,pay:v.pay})){toast("Sale recorded");render()}}
async function addItem(v){const p=v.prod.trim().toUpperCase(),va=v.vari.trim().toUpperCase(),sizes=[...new Set(v.sizes.split(",").map(x=>x.trim()).filter(Boolean))];
if(!p||!va||!sizes.length)return toast("Fill in the product, the school or colour, and at least one size");
const b=(p.replace(/[^A-Z]/g,"").slice(0,2)+va.replace(/[^A-Z]/g,"").slice(0,2)).padEnd(3,"X");let n=1,c;do{c=b+String(n++).padStart(2,"0")}while(IDX[c]);
if(await send("item",{item:[c,p,va,v.type,v.cat,sizes,[]],open:Math.max(0,+v.open||0)})){open=c;q=c;flt="";toast("Added "+c);render()}}
function preview(){const f=$("#sf");if(!f)return;const qy=+f.qty.value||0,p=+f.price.value||0,tx=qy*p*S.set.vat;$("#pv").textContent="VAT KES "+fmt(tx)+", total KES "+fmt(qy*p+tx-(+f.disc.value||0))}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-go],[data-open],[data-adj],[data-undo],[data-del],[data-apply],[data-addsz],[data-rmsz],[data-inst],[data-out],[data-st]");if(!t)return;const d=t.dataset;
if(d.go){view=d.go;if(d.low){flt="low";q=""}render();scrollTo(0,0)}
else if(d.open){open=open==d.open?null:d.open;$("#res").innerHTML=stockList()}
else if(d.adj){const[c,i,n]=d.adj.split(":");if(await send("adj",{code:c,size:IDX[c][5][i],delta:+n}))$("#res").innerHTML=stockList()}
else if(d.undo){if(confirm("Undo this sale and put the stock back?")&&await send("undo",{id:+d.undo})){toast("Sale undone");render()}}
else if(d.del){if(await send("svcdel",{id:+d.del}))render()}
else if(d.apply){let n=0;for(const k of Object.keys(T)){if(T[k]==="")continue;const[c,i]=k.split(":"),dl=(+T[k]||0)-S.q[c][i];if(dl&&!await send("adj",{code:c,size:IDX[c][5][i],delta:dl}))return;n++}T={};toast(n+" counts applied");$("#tres").innerHTML=takeList()}
else if(d.addsz){const z=$("#ns").value.trim(),c=d.addsz;if(!z)return toast("Type the new size first");if(IDX[c][5].includes(z))return toast("That size already exists");if(await send("addsz",{code:c,size:z}))$("#res").innerHTML=stockList()}
else if(d.rmsz){const[c,i]=d.rmsz.split(":");if(S.q[c][i]>0&&!confirm("This size still has "+S.q[c][i]+" in stock. Remove it anyway?"))return;if(await send("rmsz",{code:c,size:IDX[c][5][i]}))$("#res").innerHTML=stockList()}
else if(d.inst)ip.prompt();
else if(d.out){await sb.auth.signOut();location.reload()}
else if(d.st){const[u,s]=d.st.split(":");const{error}=await sb.from("profiles").update({status:s}).eq("id",u);if(error)toast(error.message);loadUsers()}});
document.addEventListener("input",e=>{const t=e.target;
if(t.id=="fq"){fq=t.value;$("#fres").innerHTML=findList()}
else if(t.id=="q"){q=t.value;$("#res").innerHTML=stockList()}
else if(t.id=="tq"){tq=t.value;$("#tres").innerHTML=takeList()}
else if(t.dataset.t){const[c,i]=t.dataset.t.split(":");T[t.dataset.t]=t.value;const el=$("#df"+c+"_"+i);if(el){const dv=t.value===""?"":+t.value-S.q[c][i];el.textContent=dv===""?"":(dv>0?"+":"")+dv}}
else if(t.name=="item"){const d=IDX[t.value.trim().toUpperCase()];t.form.size.innerHTML=d?d[5].map((z,i)=>`<option value="${i}">${esc(z)} (${S.q[d[0]][i]} in stock)</option>`).join(""):`<option value="">Pick an item first</option>`}
if(t.form&&t.form.id=="sf")preview()});
document.addEventListener("change",async e=>{const t=e.target;if(t.id=="fl"){flt=t.value;$("#res").innerHTML=stockList()}
else if(t.dataset.sn){const[c,i]=t.dataset.sn.split(":"),z=t.value.trim(),old=IDX[c][5][i];if(z===old)return;if(!z||IDX[c][5].includes(z)){toast("Size name is empty or already used");$("#res").innerHTML=stockList();return}await send("rensz",{code:c,old,size:z});$("#res").innerHTML=stockList()}
else if(t.dataset.set){const[c,i]=t.dataset.set.split(":"),nv=Math.max(0,+t.value||0),dl=nv-S.q[c][i];if(dl)await send("adj",{code:c,size:IDX[c][5][i],delta:dl});$("#res").innerHTML=stockList()}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));
if(f.id=="lf"){const m=e.submitter&&e.submitter.value,r=m=="up"?await sb.auth.signUp({email:v.email,password:v.pw}):await sb.auth.signInWithPassword({email:v.email,password:v.pw});if(r.error)return toast(r.error.message);if(m=="up"&&!r.data.session)return authForm("Account created. If asked, confirm your email, then sign in.");boot()}
else if(f.id=="rf"){const d=IDX[v.item.trim().toUpperCase()],si=parseInt(v.size,10);if(!d||!(si>=0))return toast("Choose an item and a size");const n=Math.abs(+v.qty||0);if(await send("adj",{code:d[0],size:d[5][si],delta:n})){toast("Added "+n+" to "+d[0]+" size "+d[5][si]);render()}}
else if(f.id=="sf")addSale(v);
else if(f.id=="af")addItem(v);
else if(f.id=="vf"){if(await send("svc",{date:v.date,school:v.school,svc:v.svc,qty:+v.qty,rate:+v.rate,notes:v.notes})){toast("Order saved");render()}}
else if(f.id=="stf"){if(await send("set",{name:v.name||"Wapuri Uniform",vat:(+v.vat||0)/100,low:+v.low||0,high:+v.high||1})){toast("Settings saved");render()}}});
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;if(ME.status=="active")nav()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
</script></body></html>
